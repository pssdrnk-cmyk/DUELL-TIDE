name: Idea or request
description: A feature idea, a request or a suggestion for DUELL with TIDE (no promise it will be added)
title: "[idea] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        **DUELL with TIDE** is pssdrnk's fork of DUELL 1.1 by OSCILL/R. One idea per issue, please. Bugs go in the bug report form instead.
        An idea for plain DUELL (nothing to do with TIDE or this fork's pages) belongs with [OSCILL/R](https://github.com/oscillr/DUELL/issues/new/choose).
        The [roadmap](https://github.com/pssdrnk-cmyk/DUELL-TIDE/blob/jam11/docs/ROADMAP.md) shows what is planned.
  - type: textarea
    id: idea
    attributes:
      label: What would you like?
      description: Say what you would like to happen, and what you are trying to play or make.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Which part?
      options:
        - TIDE (AUTO TIDE, TIDE SETTINGS, how a tide plays)
        - Sounds, patterns or multis
        - Sequencer or arp
        - MIDI
        - Installer, emulator or editor
        - Documents
        - Something else
  - type: input
    id: build
    attributes:
      label: Build (optional)
      description: The release tag you use (for example stable-2026-11-03), or the version in ABOUT (hold HOME).
