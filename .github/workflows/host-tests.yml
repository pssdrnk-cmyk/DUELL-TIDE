# Runs every host test group on Linux. On the owner's Windows machine 25 groups SKIP (they need fork(), or termios
# and select() on pipes: jam/wincompat); here they run. Nothing is built for the device and nothing is published.
# The groups are dealt round-robin to 8 machines that run at once (one machine took over 30 minutes); each keeps its log
# as an artifact (host-tests-log-<shard>).
name: Host tests

on:
  push:
    branches: [jam11]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: host-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # multiv8 reads the v1.0 / v1.1 files from git (the tags if there are any, else their commits)

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"          # (WebSocket is a global from Node 22: editorjson, rollbrowser, sliders)

      - name: "Python packages (the generators: Pillow, fontTools; benchaudio: numpy)"
        run: |
          sudo apt-get install -y -qq libfribidi0 libraqm0      # (Pillow's text layout: without Raqm the fonts are drawn differently)
          python3 -m pip install --quiet pillow==12.3.0 fonttools==4.65.0 numpy

      - name: Generated headers (the device build's, without its toolchain)
        run: cd felucca-base && python3 tools/build.py --gen-only

      - name: "Host tests (shard ${{ matrix.shard }} of 8)"
        shell: bash               # (an explicit bash runs with pipefail: tee keeps the runner's exit code)
        run: |
          # host_tests.sh's own default list (emu needs ~/emsdk: not here), every 8th group from this shard's place
          groups=$(sed -n 's/^want="\${\*:-\([^"]*\)}"$/\1/p' host_tests.sh | tr ' ' '\n' | grep -v '^\$' | awk -v s=${{ matrix.shard }} 'NF && (NR - 1) % 8 == s' | tr '\n' ' ')
          echo "groups: $groups"
          sh host_tests.sh $groups 2>&1 | tee host-tests.out

      - name: Failures as annotations (readable without signing in, unlike the log)
        if: failure()
        run: |
          # each failing line with the group's header and the 6 lines before it (a runner's "   FAIL" alone says nothing)
          awk '/^== /{g=$0; n=0} {b[n%6]=$0; n++} /FAIL|rror:|failed/ && index($0, "PASS (detected") == 0{s=""; for (i=(n>6?n-6:0); i<n; i++) s=s " / " b[i%6]; print g " |" s}' host-tests.out | sed 's/%/%25/g' | head -40 | while IFS= read -r l; do echo "::error title=shard ${{ matrix.shard }}::$l"; done

      - name: Keep the log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: host-tests-log-${{ matrix.shard }}
          path: |
            host-tests.out
            felucca-base/build/host/*.log
          if-no-files-found: ignore
