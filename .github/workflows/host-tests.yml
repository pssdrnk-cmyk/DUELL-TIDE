# Host tests, as the owner's rule has it (2026-11-13, work/b10/specs/PIPELINE_RULES.md K-M): the full suite runs ONCE per build, on the package about to be flashed, never per change.
#   pull request / push to jam11:  scope, jam-tools (seconds: the flash tool, the document checks) and device-build (the real device build and its size checks). The 8 test shards and the
#                                  emulator job are skipped (shown as "skipped").
#   manual run (workflow_dispatch): everything, 8 shards + emu, on the commit named in the `ref` input (default: the commit the run starts from). The build lane starts one per package:
#       curl -X POST -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" \
#         https://api.github.com/repos/pssdrnk-cmyk/DUELL-TIDE/actions/workflows/host-tests.yml/dispatches -d '{"ref":"jam11","inputs":{"ref":"<branch, tag or sha to test>"}}'
# On the owner's Windows machine 3 groups SKIP (dx7compat: no .syx banks; benchrun: termios and select() on pipes;
# benchaudio: no numpy; the fork() groups run through jam/wincompat, and in a snapshot without history otareuse SKIPs too); here they run. Nothing is published by this workflow.
# The groups are dealt to 8 machines that run at once by their measured time (the "Deal" step: tcmeas, which times two cores, has a machine to itself, the rest is balanced; one machine took over 30 minutes
# when it was round-robin); each runs its groups cores - 1 at a time (jam/fastcheck.py), never stops at a failure,
# keeps its log as an artifact (host-tests-log-<shard>), and writes a PASS / FAIL table per group plus every failed group's first failing line to its job summary.
# The runner uses a named Ubuntu release to avoid ubuntu-latest transitions; hosted image updates still apply.
# Every action is pinned to a full commit, with its version in the comment (Node 24 majors; the Node 20 ones are deprecated). The Pages workflow publishes after
# this one has passed on a push to jam11 (it runs on this workflow's completion): with the shards gone from pushes that means build and tools passed, not the suite.
name: Host tests

on:
  push:
    branches: [jam11]
  pull_request:           # (a pull request against jam11 gets the build-and-tools run; Pages starts only from a push to jam11, see pages.yml)
    branches: [jam11]
  workflow_dispatch:
    inputs:
      ref:
        description: "the full run (8 shards + emu) tests this branch, tag or commit (empty: the commit this run starts from)"
        required: false
        default: ""
      changed:
        description: "proof / dry run: act as if exactly these files (space-separated) were the pull request's changes (empty: run everything)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: host-tests-${{ github.ref }}-${{ github.event_name }}-${{ github.event.inputs.ref }}
  cancel-in-progress: true

jobs:
  # A change that only touches documents cannot break the device build, so a pull request of documents alone also skips device-build (it shows as "skipped", which tools/gh_ops.py merge counts as
  # passed; jam-tools always runs: it checks the documents). The 8 shards and the emulator job run on a manual run only (see the top). Documents: any .md outside felucca-base/ and the pictures under docs/. Not skipped: a document a test or tool reads (named by path in host_tests.sh or a file under
  # felucca-base, or docs/tide/, which web/make_site.py globs, PATCH_NUMBERS.md and TWIN_FILTER_DESIGN_2.md, which tests join by parts), anything else in the change, and every push to jam11 / manual run.
  # (The whole pull request is judged, not its last commit: the shards that tested an earlier commit of code must still run for the head.) Any doubt (no file list, an API error) runs everything.
  scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.scope.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          ref: ${{ github.event.inputs.ref }}      # (a manual run's `ref`; empty on every other event: the default checkout)

      - name: Documents only?
        id: scope
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          PROOF: ${{ github.event.inputs.changed }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess, urllib.request
          DOC = re.compile(r"^(?:(?!felucca-base/).+\.md|docs/.+\.(?:png|jpe?g|gif|svg))$")      # (felucca-base/**.md is not a document here: tools and tests read some by a path of their own)
          READ = ("docs/tide/", "docs/tide-social.png", "docs/PATCH_NUMBERS.md", "docs/design/TWIN_FILTER_DESIGN_2.md")
          def mentioned(path):          # a line of host_tests.sh or a non-document file under felucca-base names the path (not as the tail of a longer path)
              r = subprocess.run(["git", "grep", "-hF", "-e", path, "--", "host_tests.sh", "felucca-base", ":!*.md"], stdout=subprocess.PIPE, text=True, errors="replace")
              pat = re.compile(r"(?<![\w./-])" + re.escape(path) + r"(?![\w-])")
              return any(pat.search(l) for l in r.stdout.splitlines())
          def files():
              if os.environ["PROOF"].strip():
                  return os.environ["PROOF"].split()
              if os.environ["EVENT"] != "pull_request":
                  return None
              out, page = [], 1
              while True:
                  req = urllib.request.Request("https://api.github.com/repos/%s/pulls/%s/files?per_page=100&page=%d" % (os.environ["REPO"], os.environ["PR"], page),
                                               headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"], "Accept": "application/vnd.github+json"})
                  got = json.load(urllib.request.urlopen(req, timeout=60))
                  for f in got:
                      out += [f["filename"]] + ([f["previous_filename"]] if f.get("previous_filename") else [])
                  if len(got) < 100:
                      return out
                  page += 1
                  if page > 30:         # (3000 files: the API's limit; too many to judge)
                      return None
          def judge(fs):
              if not fs:
                  return True, "no file list: everything runs"
              for f in fs:
                  if not DOC.match(f):
                      return True, "code or other file in the change: " + f
              for f in fs:
                  if f.startswith(READ) or ("/" in f and mentioned(f)):
                      return True, "a test or tool reads " + f
              return False, "documents only (%d files): the host-test shards and the emulator job are skipped" % len(fs)
          try:
              code, why = judge(files())
          except Exception as e:          # (any doubt runs everything)
              code, why = True, "could not judge (%s): everything runs" % e
          print(why)
          with open(os.environ["GITHUB_OUTPUT"], "a") as o:
              o.write("code=%s\n" % ("true" if code else "false"))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as o:
              o.write("### Scope: %s\n%s\n" % ("host tests run" if code else "documents only, host tests skipped", why))
          PY

  # (The macOS CPU cost groups are not here any more: .github/workflows/cost-macos.yml, by hand and every Sunday night.)
  # The flash / backup / restore tool and its music checks (jam/test_jam_dev.py needs node for the editor's simulated unit; no MIDI, no hardware).
  jam-tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          ref: ${{ github.event.inputs.ref }}      # (a manual run's `ref`; empty on every other event: the default checkout)

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0   # v7.1.0
        with:
          python-version: "3.12"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1   # v7.1.0
        with:
          node-version: "22"

      - name: jam_dev and music_revision8 tests, document checks
        run: |
          python3 jam/test_jam_dev.py
          python3 jam/test_music_revision8.py
          python3 jam/test_ci_retry.py
          python3 jam/test_assemble_changes.py
          python3 jam/test_safe.py
          python3 jam/test_slow_tier.py
          python3 jam/check_groups.py
          python3 jam/test_check_groups.py
          python3 jam/check_docs.py

  # "It builds and fits": the real device build (tools/build.py, JieLi's clang for pi32v2), whose own checks fail the job when the image does not fit the app slot, the loader or the RAM rules. The toolchain (26 MB) and the three SDK
  # files the package uses are cached; build.py checks the SDK files' SHA-256.
  device-build:
    needs: scope
    if: needs.scope.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          ref: ${{ github.event.inputs.ref }}      # (a manual run's `ref`; empty on every other event: the default checkout)

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0   # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Python packages (the generators)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libfribidi0 libraqm0
          python3 -m pip install --quiet -r requirements-dev.txt

      - name: JieLi toolchain and SDK files (cached)
        id: tc
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6.1.0
        with:
          path: |
            ~/.jieli
            ~/fw-AC79_AIoT_SDK
          key: jieli-toolchain-sdk-v1

      - name: Fetch the toolchain and the SDK files
        if: steps.tc.outputs.cache-hit != 'true'
        run: |
          sh felucca-base/tools/get_toolchain.sh
          git clone --depth 1 --filter=blob:none --sparse --branch AC79NN_SDK_V1.2.1_2023-12-13 https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git "$HOME/fw-AC79_AIoT_SDK" \
            || { rm -rf "$HOME/fw-AC79_AIoT_SDK"; git clone --depth 1 --branch AC79NN_SDK_V1.2.1_2023-12-13 https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git "$HOME/fw-AC79_AIoT_SDK"; }
          git -C "$HOME/fw-AC79_AIoT_SDK" sparse-checkout set --no-cone /cpu/wl82/tools/uboot.boot /cpu/wl82/tools/cfg_tool.bin /cfg/eq_cfg_hw.bin || true
          ls -l "$HOME/fw-AC79_AIoT_SDK/cpu/wl82/tools/uboot.boot"

      - name: Device build (and its size checks)
        run: |
          cd felucca-base
          JIELI_TOOLCHAIN="$HOME/.jieli/toolchain" AC79_SDK="$HOME/fw-AC79_AIoT_SDK" python3 tools/build.py 2>&1 | tee build.out
          ls -l build/*.fwsc

      - name: The build's last lines as annotations (readable without signing in)
        if: failure()
        run: tail -n 25 felucca-base/build.out | sed 's/%/%25/g' | while IFS= read -r l; do echo "::error title=device-build::$l"; done

      - name: Keep the build log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        with:
          name: device-build-log
          path: felucca-base/build.out
          if-no-files-found: ignore

  # The emulator (WebAssembly) against the native build: the same samples (web/emu/native_check.c, emu_test.mjs). The emsdk setup is pages.yml's (same version, same cache key).
  emu:
    needs: scope
    if: github.event_name == 'workflow_dispatch' && needs.scope.outputs.code == 'true'      # (a manual run only: the full suite once per package)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # (gating since 2026-11-08: green on GitHub once emsdk was sourced under bash, PR #4; a red emu run stops the Pages deploy)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          ref: ${{ github.event.inputs.ref }}      # (a manual run's `ref`; empty on every other event: the default checkout)

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0   # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Emscripten SDK (cached; 6.0.13 is the pinned version, as in pages.yml)
        id: emsdk
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6.1.0
        with:
          path: ~/emsdk
          key: emsdk-6.0.13-ubuntu-24.04

      - name: Install the SDK and the generators' packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libfribidi0 libraqm0
          python3 -m pip install --quiet -r requirements-dev.txt
          if [ "${{ steps.emsdk.outputs.cache-hit }}" != "true" ]; then
            git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$HOME/emsdk"
            "$HOME/emsdk/emsdk" install 6.0.13
          fi
          "$HOME/emsdk/emsdk" activate 6.0.13

      - name: Generated headers
        run: cd felucca-base && python3 tools/build.py --gen-only

      - name: Emulator against native (host_tests.sh emu)
        shell: bash
        run: |
          # emsdk_env.sh must be sourced by bash: host_tests.sh runs under sh (dash here), where the script cannot find its own directory, found no emcc, and the group failed "no emcc"
          . "$HOME/emsdk/emsdk_env.sh"
          command -v emcc && echo "node: $EMSDK_NODE"
          sh host_tests.sh emu 2>&1 | tee emu.out      # (the runner's exit code: bash runs with pipefail)

      - name: Keep the log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        with:
          name: host-tests-log-emu
          path: |
            emu.out
            felucca-base/build/host/emu_build.log
          if-no-files-found: ignore

  host-tests:
    needs: scope
    if: github.event_name == 'workflow_dispatch' && needs.scope.outputs.code == 'true'      # (a manual run only: the full suite once per package)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          ref: ${{ github.event.inputs.ref }}      # (a manual run's `ref`; empty on every other event: the default checkout)
        # (a shallow checkout: otareuse, which reads history, SKIPs here)

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0   # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1   # v7.1.0
        with:
          node-version: "22"          # (WebSocket is a global from Node 22: editorjson, rollbrowser, sliders)

      - name: "Python packages (the generators: Pillow, fontTools; benchaudio: numpy)"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libfribidi0 libraqm0      # (Pillow's text layout: without Raqm the fonts are drawn differently)
          python3 -m pip install --quiet -r requirements-dev.txt     # (the pins are in that file)

      - name: Browser version (startup failures are reported by the browser tests)
        run: google-chrome --version

      - name: Generated headers (the device build's, without its toolchain)
        run: cd felucca-base && python3 tools/build.py --gen-only

      - name: "Host tests (shard ${{ matrix.shard }} of 8)"
        shell: bash               # (an explicit bash runs with pipefail: tee keeps the runner's exit code)
        env:
          REQUIRE_CHROME: "1"     # (rollbrowser, sliders, editorjson: a missing browser fails, it no longer reports PASS)
        run: |
          # Deal: host_tests.sh's own default list (emu needs ~/emsdk: not here) split over the 8 machines by each group's time (the table: the quickest run of the group in four recent CI runs, seconds;
          # a group not in it counts 8). tcmeas times two cores against each other and took 5 to 13 minutes next to other groups: it has a machine to itself. The others go, longest first, to the machine
          # whose finish (its groups on 3 at a time) grows least. Every machine works out the same split from the same list, so each group runs exactly once (the assert in the script fails the job if not).
          groups=$(SHARD=${{ matrix.shard }} python3 - <<'PY'
          import os, re
          T = "tcmeas:312 editorjson:288 twocore:181 tideroles:148 productcfg:110 tidebuild:105 perflevelmut:104 stophang:100 ubsanrender:99 twin:78 editb:77 handskip:69 fuzz:67 tidesteps:57 movecost:55 tidemotif:51 velaccent:45 tidecontrols:42 benchrun:41 ui:40 take:39 inherited:39 partindep:38 perform:37 silentskip:37 benchaudio:37 liverec:37 subcyc:37 sounds:36 answer:35 tideturns:34 tidejrnyfamily:33 uitruth:32 fm6liveol:30 tidedialogue:30 tidecrossings:29 sliders:29 audiopolish:29 xbmut:28 tidejrnymemory:27 midimapmut:27 shimmer:26 f36:26 perflevel:26 panic:25 tidekeep:25"
          W = {k: int(v) for k, v in (x.split(":") for x in T.split())}
          ALONE, SHARDS, SLOTS, DEFAULT = ("tcmeas",), 8, 3, 8
          m = re.search(r'^want="\$\{\*:-([^"]*)}"$', open("host_tests.sh").read(), re.M)
          groups = [g for g in m.group(1).split() if g and not g.startswith("$")]
          def span(gs):
              slot = [0] * SLOTS
              for g in sorted(gs, key=lambda g: -W.get(g, DEFAULT)):
                  slot[slot.index(min(slot))] += W.get(g, DEFAULT)
              return max(slot)
          deal = [[] for _ in range(SHARDS)]
          n = 0
          for g in ALONE:
              if g in groups:
                  deal[n] = [g]
                  n += 1
          for g in sorted((g for g in groups if g not in ALONE), key=lambda g: (-W.get(g, DEFAULT), g)):
              i = min(range(n, SHARDS), key=lambda i: (span(deal[i] + [g]), len(deal[i]), i))
              deal[i].append(g)
          assert sorted(sum(deal, [])) == sorted(groups), "the split lost or doubled a group"
          print(" ".join(deal[int(os.environ["SHARD"])]))
          PY
          )
          echo "groups: $groups"
          # jam/fastcheck.py: this shard's groups, cores - 1 at a time (the runner has 4 cores; 4 at a time starved the Chrome test editorjson once), each in its own sandbox with a compile cache; every group runs (a failure never stops the rest),
          # a stuck group stops at 25 minutes. host-tests.out is the groups' output one after the other (the steps below read it); the job summary lists every
          # failed group with its first failing line; the step fails if any group failed.
          python3 jam/fastcheck.py --limit 1500 $groups --out host-tests.out --summary "$GITHUB_STEP_SUMMARY"

      - name: Per-group result table (job summary)
        if: always()
        shell: bash
        run: |
          {
            echo "### Shard ${{ matrix.shard }}"
            echo "| group | result |"
            echo "|---|---|"
            awk '/^== /{g=substr($0, 4)} /^   PASS/{print "| " g " | PASS |"} /^   SKIP/{print "| " g " | SKIP " substr($0, 9) " |"} /^   FAIL/{print "| " g " | **FAIL** |"}' host-tests.out
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Failures as annotations (readable without signing in, unlike the log)
        if: failure()
        run: |
          # only the lines that name a failure (the tests print "twocore: FAIL <what>", "FAIL: <what>", "xyz: FAIL <what>", node prints "Error: ..."), each with its group
          # and the 3 lines before it; a table row that merely contains "failed 0" and a summary "0 FAIL" are not failures
          awk '/^== /{g=$0; n=0} {b[n%4]=$0; n++} (/FAIL|Assertion|rror:/ && !/(^|[^0-9])0 FAIL/ && !/^   FAIL$/ && index($0, "PASS (detected") == 0){s=""; for (i=(n>4?n-4:0); i<n-1; i++) s=s " / " b[i%4]; print g " | " $0 " |" s}' host-tests.out | sed 's/%/%25/g' | head -40 | while IFS= read -r l; do echo "::error title=shard ${{ matrix.shard }}::$l"; done

      - name: Keep the log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        with:
          name: host-tests-log-${{ matrix.shard }}
          path: |
            host-tests.out
            felucca-base/build/check/fast/
            felucca-base/build/host/*.log
          if-no-files-found: ignore
