# The CPU cost groups (regress, benchsim, cpuscen) on one macOS machine, the only non-Linux job. They compare host instruction counts, and the counter exists
# only on macOS (regress.c proc_pid_rusage; Linux and Windows report "not compared"). It was a job of Host tests and kept failing to get a runner
# ("The job was not acquired by Runner of type hosted": macOS capacity), holding up every run; now it is separate: started by hand (Actions > CPU cost
# (macOS) > Run workflow, on any branch) and every Sunday at 22:00 UTC on jam11. It gates nothing: the hosted VM may read 0 instructions, and the summary
# says so. A red line here is a cost regression to look at, not a test of behaviour.
name: CPU cost (macOS)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 22 * * 0"        # Sunday night, UTC (scheduled runs use the default branch, jam11)

permissions:
  contents: read

jobs:
  cost-macos:
    runs-on: macos-15
    timeout-minutes: 40
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0   # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Packages (the generators)
        run: |
          brew install fribidi libraqm
          python3 -m pip install --quiet -r requirements-dev.txt

      - name: Generated headers
        run: cd felucca-base && python3 tools/build.py --gen-only

      - name: "CPU cost groups (regress, benchsim, cpuscen)"
        shell: bash
        run: |
          set -o pipefail
          sh host_tests.sh regress benchsim cpuscen 2>&1 | tee cost.out
          {
            echo "### CPU cost (macOS)"
            if grep -q "no instruction counter" cost.out; then echo "The instruction counter read nothing on this VM: the cost parts compared nothing."; else echo "The instruction counter works here; the cost parts compared against tests/cpu_baseline.txt."; fi
            echo '```'; grep -E "^== |^   (PASS|FAIL|SKIP)|CPU entries over budget" cost.out; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
