# Publishes the DUELL with TIDE site (landing page, installer, emulator) to GitHub Pages.
#
# Nothing generated is committed. The workflow builds the site from the committed sources with
# felucca-base/web/make_site.py. The firmware packages and the emulator build are not made here (the firmware toolchain is not
# on the runner); the packages come from the GitHub releases, the emulator is built from the sources:
#   Stable  the highest-version normal (non-pre-release, non-draft) release with duell-tide-stable-X.Y.Z.fwsc (tag tide-X.Y.Z; GitHub's "Latest")
#   Beta    the newest pre-release with duell-tide-beta-X.Y.Z-bN.fwsc (tag tide-X.Y.Z-bN) whose build is NEWER than that stable one: the version
#           in the package name decides, the publishing time only breaks a tie (an older beta is superseded and not offered).
#           The older dated names (duell-tide-stable-YYYY-MM-DD.fwsc, ...-beta-...) still count and are older than any version.
#   Both go to /install/stable/ and /install/beta/, with /install/channels.json: tag, date, commit, SHA-256 (from the release's
#   .sha256 asset and GitHub's asset digest; the build stops if the package does not match them), release notes URL, known issues.
#   felucca-base/web/releases.py does the choosing and the downloads.
#   Only a build whose commit passed the tests is offered: --require-green asks, for the commit of each release's tag, whether the "Host tests" workflow
#   has a successful run on exactly that commit. The newest release that has one is chosen for each channel; a red, missing or unreadable one is skipped
#   (the log names it) and the next older release is looked at. This matters because the site is rebuilt from jam11's green head, but the packages it
#   offers come from the releases, whose commits nobody else checks.
#   duell-emulator*.zip     the emulator, any version in the name (the contents of felucca-base/build/emu, zipped) -> /emu/, from the newest
#                           release (pre-releases count, drafts do not), used only if the emulator build below leaves nothing.
# The emulator is built from the committed sources (step below). With no release at all the installer page says "not released yet"
# and keeps its install flow hidden; without the emulator zip /emu/ says the emulator is not attached. Neither fails the job.
#
# The site is published only after the "Host tests" workflow has passed on the same commit: this workflow starts when that one completes
# (workflow_run) and the build job runs only if its conclusion is success, on exactly the commit it tested (not on whatever jam11 is by then).
# A red or cancelled test run publishes nothing. To refresh release channels, run Host tests manually on jam11; its green completion publishes the site.
# The runner uses ubuntu-24.04; every action is pinned to a full commit, with its version in the comment.
name: Pages

# No `release` trigger: a release event runs from the release tag, and the github-pages environment only allows
# deployments from the configured branch. After publishing or editing a release, run
# Actions > Host tests > Run workflow on jam11: once green, Pages picks up the newest Stable and Beta releases.
on:
  workflow_run:
    workflows: ["Host tests"]
    types: [completed]
    branches: [jam11]

permissions:
  contents: read
  actions: read      # (--require-green lists the Host tests runs of a release's commit)
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Only a successful run from this repository's publishing branch can publish.
    # (the event check: a pull_request run of Host tests never publishes, even from a branch that happens to be named jam11)
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'jam11' && github.event.workflow_run.head_repository.full_name == github.repository && contains(fromJSON('["push", "workflow_dispatch"]'), github.event.workflow_run.event)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}     # (exactly the commit the tests passed on)
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0   # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Emscripten SDK (cached; 6.0.13 is the pinned version)
        id: emsdk
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6.1.0
        with:
          path: ~/emsdk
          key: emsdk-6.0.13-ubuntu-24.04

      - name: Build the emulator from the committed sources
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libfribidi0 libraqm0      # (the same fonts as the tests and the firmware: see host-tests.yml)
          pip install -r requirements-dev.txt      # (the pins the tests use: Pillow, fontTools; the same fonts)
          if [ "${{ steps.emsdk.outputs.cache-hit }}" != "true" ]; then
            git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$HOME/emsdk"
            "$HOME/emsdk/emsdk" install 6.0.13
          fi
          "$HOME/emsdk/emsdk" activate 6.0.13
          (cd felucca-base && python3 tools/build.py --gen-only)
          . "$HOME/emsdk/emsdk_env.sh"
          cd felucca-base
          EMU_PREVIEW=0 sh web/emu/build.sh
          node web/emu/note_test.mjs build/emu/felucca.wasm

      - name: Fetch the Stable and Beta packages and the emulator from the releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p dl/emu
          # the packages: releases.py picks Stable and Beta (rules in its header) and writes dl/stable.json, dl/beta.json, dl/<channel>/*.fwsc
          python3 felucca-base/web/releases.py --repo "$GH_REPO" --out dl --require-green
          # the emulator zip, as before: from the newest release, pre-releases included, drafts excluded
          tag=$(gh release list --exclude-drafts --limit 1 --json tagName --jq '.[0].tagName' || true)
          if [ -n "$tag" ]; then
            echo "newest release: $tag"
            gh release download "$tag" --pattern 'duell-emulator*.zip' --dir dl || echo "no emulator in $tag"
          else
            echo "no release yet"
          fi
          z=$(ls dl/duell-emulator*.zip 2>/dev/null | sort -V | tail -n 1 || true)   # any version; the highest wins
          if [ -n "$z" ]; then unzip -q -o "$z" -d dl/emu; fi
          true
          ls -la dl dl/stable dl/beta dl/emu 2>/dev/null || true

      - name: Build the site
        run: |
          args=""
          for ch in stable beta; do
            pkg=$(ls dl/$ch/duell-tide-$ch-*.fwsc 2>/dev/null | sort | tail -n 1 || true)
            if [ -n "$pkg" ] && [ -f "dl/$ch.json" ]; then args="$args --${ch}-pkg $pkg --${ch}-info dl/$ch.json"; fi
          done
          # the emulator built above from the sources wins over a release zip
          if [ -f felucca-base/build/emu/index.html ]; then args="$args --emu felucca-base/build/emu"
          elif [ -f dl/emu/index.html ]; then args="$args --emu dl/emu"; fi
          # no package arguments (no release yet): the installer shows "not released yet"
          python3 felucca-base/web/make_site.py $args site
          cat site/install/channels.json

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d   # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9   # v5.0.0
        with:
          path: site
          include-hidden-files: true      # (since v4 dot files are left out by default: the site's .nojekyll must stay)

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346   # v5.0.1
